version: 1
provider: ollama
endpoint: http://127.0.0.1:11434
profile: hanshermesagent

# Resident models are kept warm by hermes-preload-models.sh.
resident:
  primary:
    model: qwen3.8-hermes:27b-128k
    context: 65536
    ollama_num_ctx: 65536
    purpose: reasoning, routing, tool use, and final judgment
    think: true
    keep_alive: -1
    options:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0
      presence_penalty: 0
      num_predict: 4096
      seed: 42
    instruct_options:
      think: false
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      min_p: 0
      presence_penalty: 1.5
    benchmark_options:
      think: false
      temperature: 0
      num_predict: 200
      seed: 42
  coding_fallback:
    model: qwen3.8-hermes:27b-128k
    context: 131072
    ollama_num_ctx: 131072
    purpose: coding and fallback reasoning on the primary model
  deriver:
    model: qwen3.8-distill-2b:q4_k_m
    context: 32768
    ollama_num_ctx: 32768
    keep_alive: -1
    purpose: lightweight derivation and utility work
  embedding:
    model: nomic-embed-text
    context: 2048
    ollama_num_ctx: 2048
    keep_alive: -1
    purpose: local knowledge retrieval embeddings

# Installed but not resident; load only for an explicitly bounded task.
on_demand:
  - model: qwen3.8-distill-4b:q4_k_m
    context: 32768
    purpose: optional Qwen3.8 distill evaluation
  - model: qwen3-coder:30b
    purpose: optional coding evaluation
  - model: qwen2.5-coder:14b
    purpose: optional coding evaluation

fallback:
  provider: copilot
  models:
    - gpt-5.6-luna
    - gpt-5.5
