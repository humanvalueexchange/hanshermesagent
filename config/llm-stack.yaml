version: 1
provider: ollama
endpoint: http://127.0.0.1:11434
profile: hanshermesagent

# Resident models are kept warm by hermes-preload-models.sh.
resident:
  primary:
    model: qwen3.5:27b-128k
    context: 131072
    purpose: reasoning, routing, and final judgment
  coding_fallback:
    model: gpt-oss:20b
    context: 65536
    purpose: coding and fallback reasoning
  deriver:
    model: qwen2.5:3b
    context: 32768
    purpose: lightweight derivation and utility work
  embedding:
    model: nomic-embed-text
    context: 2048
    purpose: local knowledge retrieval embeddings

# Installed but not resident; load only for an explicitly bounded task.
on_demand:
  - model: devstral:24b
    purpose: isolated coding worker
    context: 65536
  - model: qwen3-coder:30b
    purpose: optional coding evaluation
  - model: qwen2.5-coder:14b
    purpose: optional coding evaluation

fallback:
  provider: copilot
  models:
    - gpt-5.6-luna
    - gpt-5.5
